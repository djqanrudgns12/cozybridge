[package]
name = "cozybridge-desktop"
version = "1.0.0"
description = "Cozybridge Bridge Building Puzzle Game"
authors = ["Cozybridge Team"]
edition = "2021"

[lib]
name = "cozybridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
